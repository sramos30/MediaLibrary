services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: saP@ssw0rd!
      MYSQL_DATABASE: dedup_db
      MYSQL_USER: dedup_user
      MYSQL_PASSWORD: urP@ssw0rd!
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:5-apache
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: saP@ssw0rd!

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  python:
    build:
      context: .
      dockerfile: Dockerfile.python
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - c:/Resources:/resources
      - c:/Projects:/projects
      - /x/:/extdisk1
      - MediaDiskSmb:/mediadisk
      - BigDiskSmb:/bigdisk
    working_dir: /app
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: dedup_user
      MYSQL_PASSWORD: urP@ssw0rd!
      MYSQL_DB: dedup_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
    command: tail -f /dev/null   # mantém vivo para exec/run

volumes:
  mysql-data:
  redis-data:
  MediaDiskSmb:
    driver: local
    driver_opts:
      type: cifs
      device: "${MEDIADISK_SERVER}"
      o: "username=${MEDIADISK_USER},password=${MEDIADISK_PASSWORD},uid=0,gid=0,vers=3.0,iocharset=utf8,dir_mode=0777,file_mode=0777"
  BigDiskSmb:
    driver: local
    driver_opts:
      type: cifs
      device: "${BIGDISK_SERVER}"
      o: "username=${BIGDISK_USER},password=${BIGDISK_PASSWORD},uid=0,gid=0,vers=3.0,iocharset=utf8,dir_mode=0777,file_mode=0777"
  DataDiskSmb:
    driver: local
    driver_opts:
      type: cifs
      device: "${DATADISK_SERVER}"
      o: "username=${DATADISK_USER},password=${DATADISK_PASSWORD},uid=0,gid=0,vers=3.0,iocharset=utf8,dir_mode=0777,file_mode=0777"

  